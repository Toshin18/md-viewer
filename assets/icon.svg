<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Outer border glow -->
  <rect x="18" y="24" width="92" height="80" rx="10" fill="none" stroke="#58a6ff" stroke-width="3" stroke-opacity="0.85"/>
  
  <!-- M glyph -->
  <path d="M 28 84 L 28 44 L 40 60 L 52 44 L 52 84" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow Down glyph (Markdown logo standard) -->
  <path d="M 76 44 L 76 80 M 65 69 L 76 80 L 87 69" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
